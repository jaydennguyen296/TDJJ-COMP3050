name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Build and test
        run: mvn test

      - name: Compile server
        run: mvn -q compile

      - name: Build devcontainer Docker image
        run: docker build -f .devcontainer/Dockerfile -t comp3050-assignment .

      - name: Build production Docker image
        run: docker build -t comp3050-server .