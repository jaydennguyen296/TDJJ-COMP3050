name: comp3050-dev

services:
  server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    command: >
      bash -lc "mvn -q -DskipTests compile &&
      (mvn -q exec:java &) &&
      for i in $(seq 1 60); do curl -s --connect-timeout 1 http://127.0.0.1:8000/login >/dev/null 2>&1 && break; sleep 1; done &&
      nginx -g 'daemon off;'"
    ports:
      - "80:80"
    expose:
      - "8000"
    volumes:
      - ..:/workspace
