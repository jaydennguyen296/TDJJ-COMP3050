name: comp3050-dev

services:
  server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    command: >
      bash -lc "mvn -q -DskipTests compile &&
      (mvn -q exec:java &) &&
      nginx -g 'daemon off;'"
    ports:
      - "80:80"
    expose:
      - "8000"
    volumes:
      - ..:/workspace
